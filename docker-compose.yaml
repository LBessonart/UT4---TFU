services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maquetaapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maquetaapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      API_INSTANCE: api1
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=maquetaapi;Username=postgres;Password=postgres
      DiscountStrategy: percentage
    depends_on:
      db:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      API_INSTANCE: api2
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=maquetaapi;Username=postgres;Password=postgres
      DiscountStrategy: percentage
    depends_on:
      db:
        condition: service_healthy

  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "5050:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  postgres_data:
