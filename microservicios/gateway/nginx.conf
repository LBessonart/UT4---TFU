# Gatekeeper (Nginx): único punto de entrada al sistema.
#  - Routing Rules: cada prefijo de URL va al microservicio dueño de ese contexto de negocio.
#  - Rate Limiting: limita solicitudes por IP (HTTP 429 al excederse).
#  - API Key: valida X-API-Key antes de que el tráfico llegue a la red interna.
# Los microservicios no publican puertos al host: solo se llega a ellos a través del Gatekeeper.

events {}

http {
    # DNS interno de Docker. Resolver en tiempo de ejecución (proxy_pass con variable) permite que
    # Nginx arranque aunque un servicio esté caído y que siga la nueva IP cuando el contenedor vuelve.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;
    limit_req_status 429;

    map $http_x_api_key $api_key_valida {
        default          0;
        "dev-key-12345"  1;
        "prod-key-67890" 1;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    server {
        listen 80;
        default_type application/json;

        # Fallo de un upstream (contenedor apagado) -> 503 en JSON, no la página HTML de Nginx
        error_page 502 504 = @no_disponible;
        location @no_disponible {
            return 503 '{"error":"Servicio no disponible","origen":"gatekeeper"}';
        }

        location = /health {
            return 200 '{"status":"ok","componente":"gatekeeper"}';
        }

        location ~ ^/health/(catalogo|clientes|pedidos)$ {
            set $servicio $1;
            proxy_pass http://$servicio:8080/health;
        }

        # ---- Servicio de Catálogo (REST) ----
        location /api/productos {
            limit_req zone=por_ip burst=40 nodelay;
            if ($api_key_valida = 0) { return 401 '{"error":"API Key requerida o inválida"}'; }
            set $catalogo catalogo;
            proxy_pass http://$catalogo:8080;
        }

        # Contrato WSDL público. El endpoint SOAP (POST /ws/productos) NO se publica:
        # ReservarStock / LiberarStock solo se invocan desde la red interna (Servicio de Pedidos).
        location = /ws/productos.wsdl {
            limit_req zone=por_ip burst=40 nodelay;
            set $catalogo catalogo;
            proxy_pass http://$catalogo:8080;
        }

        # Inyección de fallas del catálogo, solo para la demo de disponibilidad
        location /admin/catalogo/ {
            if ($api_key_valida = 0) { return 401 '{"error":"API Key requerida o inválida"}'; }
            set $catalogo catalogo;
            rewrite ^/admin/catalogo/(.*)$ /admin/$1 break;
            proxy_pass http://$catalogo:8080;
        }

        # ---- Servicio de Clientes (REST) ----
        location /api/clientes {
            limit_req zone=por_ip burst=40 nodelay;
            if ($api_key_valida = 0) { return 401 '{"error":"API Key requerida o inválida"}'; }
            set $clientes clientes;
            proxy_pass http://$clientes:8080;
        }

        # ---- Servicio de Pedidos (REST) ----
        location /api/pedidos {
            limit_req zone=por_ip burst=40 nodelay;
            if ($api_key_valida = 0) { return 401 '{"error":"API Key requerida o inválida"}'; }
            set $pedidos pedidos;
            proxy_pass http://$pedidos:8080;
        }

        location / {
            return 404 '{"error":"Ruta no encontrada"}';
        }
    }
}
